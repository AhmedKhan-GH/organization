# .github/workflows/sternbild-docs.yml
name: Sternbild Docs
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sternbild-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./packages/sternbild-docs pytest
      - run: pytest packages/sternbild-docs/tests
